name: generate snake

on:
  schedule:
    - cron: "0 3 * * *"   # todos os dias às 3h — hora ndnrs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: gerar animação da cobra
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2C5C8F&color_dots=#ebedf0,#B7CCE3,#8FB4DB,#5E8DC0,#2C5C8F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8FB4DB&color_dots=#161B22,#112233,#1c4a75,#2C5C8F,#8FB4DB

      - name: publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
